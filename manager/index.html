<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docker Manager</title>

<style>
:root{
 --card:#fff;
 --soft:#f5f7fa;
 --text:#222;
 --muted:#6b7280;
 --line:#e5e7eb;
 --blue:#3273dc;
 --green:#22a06b;
 --red:#d64545;
 --orange:#d98b19
}

@media(prefers-color-scheme:dark){
 :root{
  --card:#22252a;
  --soft:#292d33;
  --text:#f3f4f6;
  --muted:#a6adb7;
  --line:#3b4048
 }
}

*{box-sizing:border-box}

html,body{
 background:transparent!important;
}

body{
 margin:0;
 color:var(--text);
 font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.tabs{
 display:flex;
 gap:6px;
 flex-wrap:wrap;
 margin-bottom:16px;
}

.tabs button,.btn{
 border:1px solid var(--line);
 background:var(--card);
 color:var(--text);
 border-radius:5px;
 padding:8px 12px;
 cursor:pointer;
}

.tabs button.active,.btn.primary{
 background:var(--blue);
 border-color:var(--blue);
 color:white;
}

.btn.danger{
 background:var(--red);
 border-color:var(--red);
 color:#fff;
}

.btn.warn{
 background:var(--orange);
 border-color:var(--orange);
 color:#fff;
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:12px;
 margin-bottom:14px;
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:6px;
 padding:15px;
 margin-bottom:12px;
}

.metric{
 font-size:24px;
 font-weight:700;
}

.muted{color:var(--muted)}
.good{color:var(--green)}
.bad{color:var(--red)}

.view{display:none}
.view.active{display:block}

.item{
 border-top:1px solid var(--line);
 padding:12px 0;
}

.item:first-child{border-top:0}

.head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
}

.name{
 font-weight:600;
 font-size:15px;
}

.badge{
 display:inline-block;
 background:var(--soft);
 padding:3px 8px;
 border-radius:999px;
 font-size:12px;
}

.actions{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:10px;
}

.details{
 display:none;
 background:var(--soft);
 padding:12px;
 border-radius:5px;
 margin-top:10px;
 line-height:1.65;
}

.details.open{display:block}

.search{
 width:100%;
 border:1px solid var(--line);
 background:var(--card);
 color:var(--text);
 border-radius:5px;
 padding:9px;
 margin-bottom:10px;
}

.notice{
 border:1px solid var(--line);
 padding:12px;
 border-radius:5px;
 margin-bottom:12px;
 white-space:pre-wrap;
}

.log{
 white-space:pre-wrap;
 background:#111;
 color:#eee;
 padding:14px;
 border-radius:5px;
 max-height:500px;
 overflow:auto;
}

table{
 width:100%;
 border-collapse:collapse;
}

td,th{
 padding:8px;
 text-align:left;
 border-bottom:1px solid var(--line);
}

@media(max-width:800px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .head{align-items:flex-start}
}

@media(max-width:500px){
 .grid{grid-template-columns:1fr}
}


/* RICOREWI_VOLUME_CSS_5C3D */

.volume-summary{
 display:grid;
 grid-template-columns:repeat(
  3,
  minmax(0,1fr)
 );
 gap:12px;
 margin-top:16px;
}

.volume-summary>div{
 border:1px solid rgba(127,127,127,.2);
 border-radius:8px;
 padding:12px;
}

.volume-summary b{
 display:block;
 font-size:20px;
}

.volume-summary span{
 font-size:12px;
 opacity:.7;
}

.volume-card{
 margin-top:12px;
}

.volume-detail{
 margin-top:14px;

}

.volume-detail code{
 word-break:break-all;
}

.volume-users{
 margin-top:7px;
}

.volume-users>div{
 padding:4px 0;
}

@media(max-width:700px){

 .volume-summary{
  grid-template-columns:1fr;
 }

}


</style>

<body>

<div class="tabs">
 <button data-v="overview">Übersicht</button>
 <button data-v="containers">Container</button>
 <button data-v="install">Installieren</button>
 <button data-v="projects">Projekte / Stacks</button>
 <button data-v="images">Images</button>
 <button data-v="volumes">Volumes</button>
 <button data-v="networks">Netzwerke</button>
 <button data-v="ports">Ports / Endpoints</button>
 <button data-v="updates">Updates</button>
 <button data-v="backups">Backups</button>
 <button data-v="registry">Registry</button>
 <button data-v="system">System</button>
 <button data-v="help">Hilfe</button>
</div>

<div id="msg"></div>

<section id="overview" class="view"></section>
<section id="containers" class="view"></section>
<section id="install" class="view"></section>
<section id="projects" class="view"></section>
<section id="images" class="view"></section>
<section id="volumes" class="view"></section>
<section id="networks" class="view"></section>
<section id="ports" class="view"></section>
<section id="updates" class="view"></section>
<section id="backups" class="view"></section>
<section id="registry" class="view"></section>
<section id="system" class="view"></section>
<section id="help" class="view"></section>

<script>


window.addEventListener('message',e=>{
 if(e.origin!==location.origin || !e.data){
  return;
 }

 if(e.data.type==='keyhelp-docker-auth'){
  KEYHELP_DOCKER_TOKEN=String(e.data.token||'');
  return;
 }

 if(e.data.type==='keyhelp-docker-view'){
  const allowed=[
     'overview',
     'containers',
     'install',
     'projects',
     'images',
     'volumes',
     'networks',
     'ports',
     'updates',
     'backups',
     'registry',
     'system',
     'help'
   ];

  const requested=String(e.data.view||'overview');

  if(!allowed.includes(requested)){
   return;
  }

  view(requested);

  try{
   parent.postMessage({
    type:'docker-view',
    view:requested
   },location.origin);
  }catch(err){}
 }
});

let S={containers:[]};
let U={containers:[]};
let X={images:[],volumes:[],networks:[],disk:[]};
let P={projects:[]};
let R={registries:[],updated:null};

const $=s=>document.querySelector(s);

function esc(v){
 const d=document.createElement('div');
 d.textContent=v??'';
 return d.innerHTML;
}


/* =========================================================
   REGISTRY MANAGEMENT – 5C.3B-2
   ========================================================= */

async function registryApi(action,data={}){
 const response=await fetch(
  '/keyhelp-docker-api/action.cgi',
  {
   method:'POST',
   credentials:'same-origin',
   headers:{
    'Content-Type':'application/json',
    'X-Requested-With':'KeyHelpDockerManager',
    'X-KeyHelp-Docker-Token':KEYHELP_DOCKER_TOKEN
   },
   body:JSON.stringify({
    action,
    ...data
   })
  }
 );

 const raw=await response.text();

 let result;

 try{
  result=JSON.parse(raw);
 }catch(e){
  throw new Error(
   'Server lieferte keine gültige JSON-Antwort.\n'+
   'HTTP '+response.status+'\n\n'+
   raw.slice(0,1000)
  );
 }

 if(!response.ok || result.ok===false){
  throw new Error(
   result.output ||
   result.error ||
   result.message ||
   ('HTTP '+response.status)
  );
 }

 return result;
}


function registryMessage(title,text,type='info'){
 const box=document.getElementById('registry-message');

 if(!box){
  return;
 }

 box.className='registry-message '+type;

 box.innerHTML=
  '<div class="registry-message-title">'+
   esc(title)+
  '</div>'+
  '<pre>'+esc(text||'')+'</pre>';

 box.style.display='block';

 setTimeout(resize,30);
}


function registryBusy(on,text='Bitte warten …'){
 const box=document.getElementById('registry-busy');

 if(!box){
  return;
 }

 box.textContent=text;
 box.style.display=on?'block':'none';

 document
  .querySelectorAll('#registry button')
  .forEach(b=>b.disabled=!!on);
}


async function registryReload(){
 registryBusy(true,'Registry-Daten werden geladen …');

 try{
  const result=await registryApi('registry-list');

  let list=[];

  try{
   list=JSON.parse(result.output||'[]');
  }catch(e){
   throw new Error(
    'Registry-Liste konnte nicht gelesen werden.\n\n'+
    (result.output||'')
   );
  }

  R={
   registries:Array.isArray(list)?list:[],
   updated:new Date().toISOString()
  };

  renderRegistry();

 }catch(err){
  registryMessage(
   'Registry-Liste konnte nicht geladen werden',
   err.message || String(err),
   'error'
  );
 }finally{
  registryBusy(false);
 }
}


async function registryLogin(){
 const registry=(
  document.getElementById('registry-host')?.value || ''
 ).trim();

 const username=(
  document.getElementById('registry-user')?.value || ''
 ).trim();

 const password=
  document.getElementById('registry-password')?.value || '';

 if(!registry){
  registryMessage(
   'Eingabe fehlt',
   'Bitte eine Registry angeben.',
   'error'
  );
  return;
 }

 if(!username){
  registryMessage(
   'Eingabe fehlt',
   'Bitte einen Benutzernamen angeben.',
   'error'
  );
  return;
 }

 if(!password){
  registryMessage(
   'Eingabe fehlt',
   'Bitte Passwort oder Token angeben.',
   'error'
  );
  return;
 }

 registryBusy(
  true,
  'Anmeldung an '+registry+' läuft …'
 );

 try{
  const result=await registryApi(
   'registry-login',
   {
    registry,
    username,
    password
   }
  );

  const pass=
   document.getElementById('registry-password');

  if(pass){
   pass.value='';
  }

  registryMessage(
   'Anmeldung erfolgreich',
   result.output || 'Registry-Anmeldung abgeschlossen.',
   'success'
  );

  await registryReload();

 }catch(err){
  registryMessage(
   'Anmeldung fehlgeschlagen',
   err.message || String(err),
   'error'
  );
 }finally{
  registryBusy(false);
 }
}


async function registryTest(registryArg=''){
 const input=document.getElementById('registry-host');

 const registry=(
  registryArg ||
  input?.value ||
  ''
 ).trim();

 if(!registry){
  registryMessage(
   'Eingabe fehlt',
   'Bitte eine Registry angeben.',
   'error'
  );
  return;
 }

 registryBusy(
  true,
  'Verbindung zu '+registry+' wird geprüft …'
 );

 try{
  const result=await registryApi(
   'registry-test',
   {registry}
  );

  registryMessage(
   'Verbindung erfolgreich',
   result.output ||
   'Registry ist erreichbar.',
   'success'
  );

 }catch(err){
  registryMessage(
   'Verbindungstest fehlgeschlagen',
   err.message || String(err),
   'error'
  );
 }finally{
  registryBusy(false);
 }
}


async function registryLogout(registry){
 registry=String(registry||'').trim();

 if(!registry){
  return;
 }

 if(!confirm(
  'Registry-Anmeldung für '+registry+
  ' wirklich entfernen?'
 )){
  return;
 }

 registryBusy(
  true,
  'Abmeldung von '+registry+' läuft …'
 );

 try{
  const result=await registryApi(
   'registry-logout',
   {registry}
  );

  registryMessage(
   'Abmeldung erfolgreich',
   result.output ||
   'Registry-Anmeldung wurde entfernt.',
   'success'
  );

  await registryReload();

 }catch(err){
  registryMessage(
   'Abmeldung fehlgeschlagen',
   err.message || String(err),
   'error'
  );
 }finally{
  registryBusy(false);
 }
}


function renderRegistry(){
 const root=document.getElementById('registry');

 if(!root){
  return;
 }

 const regs=Array.isArray(R?.registries)
  ? R.registries
  : [];

 const rows=regs.length
  ? regs.map((r,index)=>{
     const registry=
      typeof r==='string'
       ? r
       : (
          r.registry ||
          r.server ||
          r.host ||
          r.name ||
          ''
         );

     const username=
      typeof r==='object' && r
       ? (
          r.username ||
          r.user ||
          ''
         )
       : '';

     if(!registry){
      return '';
     }

     return `
      <div class="registry-entry">
       <div class="registry-entry-main">
        <div class="name">
         ${esc(registry)}
        </div>

        <div class="muted">
         ${
          username
           ? 'Benutzer: '+esc(username)
           : 'Docker Registry'
         }
        </div>
       </div>

       <div class="actions">
        <button
         class="btn"
         onclick='registryTest(${JSON.stringify(registry)})'>
         Test
        </button>

        <button
         class="btn danger"
         onclick='registryLogout(${JSON.stringify(registry)})'>
         Logout
        </button>
       </div>
      </div>
     `;
    }).join('')
  : `
     <div class="registry-empty">
      Noch keine Registry-Anmeldung gespeichert.
     </div>
    `;

 root.innerHTML=`
  <div class="registry-head">
   <div>
    <h2>Docker Registries</h2>
    <div class="muted">
     Private und öffentliche Docker-Registries
     verwalten.
    </div>
   </div>

   <button
    class="btn"
    onclick="registryReload()">
    Neu laden
   </button>
  </div>

  <div
   id="registry-busy"
   class="registry-busy"
   style="display:none">
  </div>

function state(c){

 if(c.health==='healthy')
  return '<span class="good">● Healthy</span>';

async function action(a,t=''){

 const dangerous = new Set([
  'stop',
  'remove-container',
  'remove-image',
  'remove-volume',
  'prune-images',
  'prune-volumes',
  'prune-networks',
  'prune-build-cache',
  'update',
  'install-engine'
 ]);

 const labels = {
  'start':'Container starten',
  'stop':'Container stoppen',
  'restart':'Container neu starten',
  'logs':'Logs laden',
  'inspect':'Container untersuchen',
  'backup':'Backup erstellen',
  'update-check':'Updates prüfen',
  'update':'Container aktualisieren',
  'install-engine':'Docker installieren / prüfen',
  'pull-image':'Image herunterladen',
  'remove-container':'Container entfernen',
  'remove-image':'Image entfernen',
  'remove-volume':'Volume entfernen',
  'prune-images':'Ungenutzte Images bereinigen',
  'prune-volumes':'Ungenutzte Volumes bereinigen',
  'prune-networks':'Ungenutzte Netzwerke bereinigen',
  'prune-build-cache':'Build-Cache bereinigen'
 };

 const label = labels[a] || a;

 if(dangerous.has(a)){
  let msg =
   'Aktion wirklich ausführen?\n\n' +
   label +
   (t ? '\nZiel: ' + t : '');

  if(a === 'remove-volume'){
   msg +=
    '\n\nACHTUNG: Ein Volume kann dauerhafte Daten enthalten.';
  }

  if(a === 'remove-container'){
   msg +=
    '\n\nDer Container wird entfernt. Persistente Daten hängen von den verwendeten Volumes/Mounts ab.';
  }

  if(a === 'update'){
   msg +=
    '\n\nVor produktiven Updates sollte ein aktuelles Backup vorhanden sein.';
  }

  if(!confirm(msg)){
   return;
  }
 }

 // ---------------------------------------------------------
 // UI sperren
 // ---------------------------------------------------------

 const buttons = [...document.querySelectorAll('button')];

 buttons.forEach(b => {
  b.dataset.wasDisabled = b.disabled ? '1' : '0';
  b.disabled = true;
 });

 const overlay = document.createElement('div');
 overlay.className = 'busy-overlay';
 overlay.id = 'docker-busy-overlay';

 const box = document.createElement('div');
 box.className = 'busy-box';
 box.textContent = label + ' …';

 overlay.appendChild(box);
 document.body.appendChild(overlay);

 try{

  const response = await fetch(
   '/keyhelp-docker-api/action.cgi',
   {
    method:'POST',
    credentials:'same-origin',
    headers:{
     'Content-Type':'application/json',
     'X-Requested-With':'KeyHelpDockerManager',},
    body:JSON.stringify({
     action:a,
     target:t
    })
   }
  );

  // Erst Text lesen.
  // Dadurch bekommen wir auch bei Apache-/CGI-HTML-Fehlern
  // eine verständliche Meldung statt "Unexpected token <".
  const raw = await response.text();

  let result;

  try{
   result = JSON.parse(raw);
  }catch(e){

   const preview = raw
    .replace(/<[^>]*>/g,' ')
    .replace(/\s+/g,' ')
    .trim()
    .slice(0,500);

   throw new Error(
    'Server lieferte keine gültige JSON-Antwort.' +
    '\nHTTP ' + response.status +
    (preview ? '\n\n' + preview : '')
   );
  }

  if(!response.ok || result.ok === false){

   const message =
    result.output ||
    result.error ||
    result.message ||
    ('HTTP ' + response.status);

   throw new Error(message);
  }

  let output =
   result.output ||
   result.message ||
   'Aktion erfolgreich abgeschlossen.';

  showDockerModal(
   label,
   output,
   false
  );

  // Status nach Aktion neu einlesen.
  // Beim Update-Check kurz Cache vermeiden und danach neu rendern.
  if(a==='update-check'){
   try{
    U=await fetch(
     '../updates.json?'+Date.now(),
     {cache:'no-store'}
    ).then(r=>{
     if(!r.ok) throw new Error('updates.json HTTP '+r.status);
     return r.json();
    });
   }catch(e){
    console.error('updates.json konnte nicht neu geladen werden:',e);
   }
  }

  if(typeof load === 'function'){
   await load();
  }

 }catch(err){

  console.error('Docker Manager:', err);

  showDockerModal(
   'Docker-Aktion fehlgeschlagen – ' + label,
   (err && err.message ? err.message : String(err)),
   true
  );

 }finally{

  const currentOverlay =
   document.getElementById('docker-busy-overlay');

  if(currentOverlay){
   currentOverlay.remove();
  }

  buttons.forEach(b => {
   b.disabled = b.dataset.wasDisabled === '1';
   delete b.dataset.wasDisabled;
  });
 }
}

function networkProtected(name){
 return ['bridge','host','none'].includes(String(name||''));
}

function networkIpam(network){
 const configs=network?.ipam?.Config || network?.ipam?.config || [];

 if(!Array.isArray(configs) || !configs.length){
  return {
   subnet:'–',
   gateway:'–',
   range:'–'
  };
 }

 const c=configs[0] || {};

 return {
  subnet:c.Subnet || c.subnet || '–',
  gateway:c.Gateway || c.gateway || '–',
  range:c.IPRange || c.ip_range || c.iprange || '–'
 };
}

function networkContainerOptions(selected=''){
 const containers=S.containers||[];

 return containers.map(c=>{
  const name=String(c.name||'');

  return `
   <option value="${esc(name)}"
    ${name===selected?'selected':''}>
    ${esc(name)}
   </option>
  `;
 }).join('');
}

async function networkCreate(){
 const name=(
  document.getElementById('network-create-name')?.value || ''
 ).trim();

 const driver=(
  document.getElementById('network-create-driver')?.value || 'bridge'
 ).trim();

 const subnet=(
  document.getElementById('network-create-subnet')?.value || ''
 ).trim();

 const gateway=(
  document.getElementById('network-create-gateway')?.value || ''
 ).trim();

 const internal=
  !!document.getElementById('network-create-internal')?.checked;

 if(!name){
  managerMessage(
   'Netzwerkname fehlt',
   'Bitte einen Namen für das Docker-Netzwerk eingeben.',
   'error'
  );
  return;
 }

 const data={
  name,
  target:name,
  driver,
  subnet,
  gateway,
  internal
 };

 const result=await actionData(
  'network-create',
  data,
  'Docker-Netzwerk erstellen'
 );

 if(result!==false){
  await load();
  view('networks');
 }
}

async function networkInspect(name){
 const result=await actionData(
  'network-inspect',
  {
   name:name,
   target:name,
   network:name
  },
  'Netzwerk untersuchen'
 );

 if(!result || result===false){
  return;
 }

 let output=result.output || '';

 try{
  const parsed=JSON.parse(output);
  output=JSON.stringify(parsed,null,2);
 }catch(e){}

 showDockerOutput(
  'Network Inspect: '+name,
  output || 'Keine Ausgabe.'
 );
}

async function networkRemove(name){
 if(networkProtected(name)){
  managerMessage(
   'Geschütztes Docker-Netzwerk',
   'Die Docker-Systemnetzwerke bridge, host und none werden vom Manager nicht gelöscht.',
   'error'
  );
  return;
 }

 const network=(X.networks||[]).find(
  n=>String(n.name)===String(name)
 );

 if(network && (network.containers||[]).length){
  managerMessage(
   'Netzwerk wird verwendet',
   'Vor dem Löschen müssen alle Container von diesem Netzwerk getrennt werden.',
   'error'
  );
  return;
 }

 if(!confirm(
  'Docker-Netzwerk "'+name+'" wirklich löschen?\n\n'+
  'Dieser Vorgang kann nicht rückgängig gemacht werden.'
 )){
  return;
 }

 const result=await actionData(
  'network-remove',
  {
   name:name,
   target:name,
   network:name
  },
  'Docker-Netzwerk löschen'
 );

 if(result!==false){
  await load();
  view('networks');
 }
}

async function actionData(actionName,data,label){
 const buttons=[...document.querySelectorAll('button')];

 buttons.forEach(b=>{
  b.dataset.wasDisabled=b.disabled?'1':'0';
  b.disabled=true;
 });

 const overlay=document.createElement('div');
 overlay.className='busy-overlay';
 overlay.id='docker-busy-overlay';

 const box=document.createElement('div');
 box.className='busy-box';
 box.textContent=label+' …';

 overlay.appendChild(box);
 document.body.appendChild(overlay);

 try{

  const response=await fetch(
   '/keyhelp-docker-api/action.cgi',
   {
    method:'POST',
    credentials:'same-origin',
    headers:{
     'Content-Type':'application/json',
     'X-Requested-With':'KeyHelpDockerManager',
     'X-KeyHelp-Docker-Token':KEYHELP_DOCKER_TOKEN
    },
    body:JSON.stringify({
     action:actionName,
     ...data
    })
   }
  );

  const raw=await response.text();

  let result;

  try{
   result=JSON.parse(raw);
  }catch(e){
   throw new Error(
    'Server lieferte keine gültige JSON-Antwort.\nHTTP '+
    response.status+
    '\n\n'+
    raw.replace(/<[^>]*>/g,' ')
       .replace(/\s+/g,' ')
       .trim()
       .slice(0,1000)
   );
  }

  if(!response.ok || result.ok===false){
   throw new Error(
    result.output||
    result.error||
    result.message||
    ('HTTP '+response.status)
   );
  }

  showResult(
   label,
   result.output||
   result.message||
   'Aktion erfolgreich abgeschlossen.',
   true
  );

  if(typeof load==='function'){
   await load();
  }

  return result;

 }catch(err){

  console.error('Docker Manager:',err);

  showResult(
   label+' fehlgeschlagen',
   err && err.message
    ? err.message
    : String(err),
   false
  );

 }finally{

  const currentOverlay=
   document.getElementById('docker-busy-overlay');

  if(currentOverlay){
   currentOverlay.remove();
  }

  buttons.forEach(b=>{
   b.disabled=b.dataset.wasDisabled==='1';
   delete b.dataset.wasDisabled;
  });

  resize();
 }
}

function portExposure(p){
 const ip=String(p.host_ip||'');

 if(!p.host_port){
  return {
   cls:'port-internal',
   text:'nur intern'
  };
 }

 if(ip==='127.0.0.1' || ip==='::1'){
  return {
   cls:'port-local',
   text:'localhost'
  };
 }

 if(ip==='0.0.0.0' || ip==='::' || ip===''){
  return {
   cls:'port-public',
   text:'öffentlich gebunden'
  };
 }

 return {
  cls:'port-bound',
  text:ip
 };
}

function volumeUsageMap(){

 const result={};

 (S.containers||[]).forEach(container=>{

  (container.mounts||[]).forEach(mount=>{

   if(
    mount.type!=='volume' ||
    !mount.name
   ){
    return;
   }

   if(!result[mount.name]){
    result[mount.name]=[];
   }

   result[mount.name].push({
    container:container.name,
    destination:mount.destination||'–',
    rw:mount.rw!==false
   });

  });

 });

 return result;
}

async function load(){
 try{
  [S,U,X,P,R]=await Promise.all([
   fetch('../status.json?'+Date.now()).then(r=>r.json()),
   fetch('../updates.json?'+Date.now())
    .then(r=>r.json())
    .catch(()=>({containers:[]})),
   fetch('../system.json?'+Date.now())
    .then(r=>r.json())
    .catch(()=>({images:[],volumes:[],networks:[],disk:[]})),
   fetch('../projects.json?'+Date.now())
    .then(r=>r.json())
    .catch(()=>({projects:[],count:0})),
    fetch('../registries.json?'+Date.now(),{
     cache:'no-store'
    })
     .then(r=>{
      if(!r.ok){
       throw new Error(
        'registries.json HTTP '+r.status
       );
      }
      return r.json();
     })
     .catch(()=>({
      registries:[],
      updated:null
     }))
  ]);

  render();

 }catch(e){
  $('#msg').innerHTML=
   '<div class="notice bad">'+esc(e.message)+'</div>';
 }
}

document.querySelectorAll('.tabs button').forEach(
 b=>b.onclick=()=>view(b.dataset.v)
);

view((location.hash||'#overview').slice(1));

load();
setInterval(load,30000);
</script>
